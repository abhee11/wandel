<!doctype html><meta charset="utf-8"><title>Wandel inspection recovery manual check</title><style>body{font:16px system-ui;padding:24px}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style><h1>Inspection recovery</h1><p>Real recovery function with controlled planner responses. No paid AI calls.</p><button id="repeat">Repeated inspection</button><button id="resolved">Inspection resolves</button><button id="question">Genuine question</button><button id="empty">Missing question</button><pre id="output">Ready</pre><script type="module">
import {applyVerifiedPlan} from '/extension/assistant/applyVerified.ts';
const context={workflowId:'diagnostic',stateId:'original',elements:[{ref:'e_option',tag:'button',role:'option',name:'Activity 2',text:'Activity 2',bounds:{x:0,y:0}}]};
const edit={status:'edit',message:'Rename option',question:null,candidates:[],actions:[{kind:'text',targets:['e_option'],text:'Test',relativeTo:null,element:null,description:null,labels:[],position:null,styleRef:null,style:null,destination:null,newViewTitle:null,resultRef:null}]};
async function run(mode){let inspections=0,replans=0,applies=0,feedback=[];const result=await applyVerifiedPlan('Add Test to activity dropdown',edit,context,{active:()=>true,repairing:()=>{},refresh:async()=>context,inspect:async()=>{inspections++;return context;},apply:async()=>{applies++;if(applies===1)throw Error('Preview not applied: The selected heading has no editable text.');},replan:async(note)=>{replans++;feedback.push(note);if(mode==='resolved'&&inspections)return edit;if(mode==='question')return {status:'clarify',message:'Which activity should Test copy?',question:'Which activity should Test copy?',candidates:['e_option'],actions:[]};if(mode==='empty')return {status:'clarify',message:'I will inspect the labels.',question:null,candidates:['e_option'],actions:[]};return {status:'inspect',message:'I will inspect the labels.',question:null,candidates:['e_option'],actions:[]};}});document.querySelector('#output').textContent=JSON.stringify({mode,inspections,replans,applyCalls:applies,status:result.status,question:result.question,message:result.message,candidates:result.candidates,waiting:result.status==='clarify',receivedStopGuidance:feedback.some(s=>s.includes('not revealing new information'))},null,2);}
for(const mode of ['repeat','resolved','question','empty'])document.getElementById(mode).onclick=()=>run(mode);
</script>
