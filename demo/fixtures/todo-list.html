<!doctype html><html><head><meta charset="utf-8"><title>Wandel · to-do list</title><style>
/* Mirrors TodoMVC's list rows: an invisible toggle and a label whose circle is an inline SVG background. */

</style></head><body><main id="page"><ul class="todo-list"><li><div class="view"><input class="toggle" type="checkbox"><label>Plan the sprint review</label></div></li><li><div class="view"><input class="toggle" type="checkbox"><label>Write release notes</label></div></li><li><div class="view"><input class="toggle" type="checkbox"><label>Book design critique</label></div></li></ul></main>
