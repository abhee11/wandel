<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Wandel · free visibility check</title><style>
body{font:14px/1.5 system-ui;margin:24px;color:#202638}table{border-collapse:collapse;width:100%;max-width:1100px}td,th{border-bottom:1px solid #e3e0ef;padding:8px;text-align:left;vertical-align:top}.pass{color:#16794a;font-weight:600}.fail{color:#b4233a;font-weight:600}iframe{position:absolute;left:-3000px;width:1300px;height:900px}
</style></head><body>
<h1>Free visibility check (no AI)</h1><p>Runs each case in a fresh frame through the real Wandel pipeline. Run it before any paid request.</p>
<table><thead><tr><th>Case</th><th>Result</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
<script type="module">
const names=['Card hidden until Home is clicked, then shown below; Undo removes it','Toggle hides and shows again','Hidden at load with nothing that shows it is reported','A container the page hides still reports the new card','New menu item with no destination shows a hidden card','Copy of an icon-only sidebar item named X shows a hidden card','New menu option opens its page, and General returns','Dragging a card moves it in the layout, into a panel, and Undo returns it'];
const rows=document.getElementById('rows');
// Each run starts clean: a frame can close before its last draft is saved, and that stale draft would start the next run.
localStorage.clear();sessionStorage.clear();
for(const name of names){
 const row=rows.insertRow();row.insertCell().textContent=name;const status=row.insertCell(),detail=row.insertCell();status.textContent='Running…';
 const result=await new Promise(resolve=>{const frame=document.createElement('iframe');const done=r=>{removeEventListener('message',on);frame.remove();resolve(r);};const on=e=>{if(e.data?.wandelCase===name)done(e.data);};addEventListener('message',on);setTimeout(()=>done({pass:false,detail:'Timed out.'}),15000);frame.src='visibility-case.html?case='+encodeURIComponent(name);document.body.append(frame);});
 status.textContent=result.pass?'Pass':'Fail';status.className=result.pass?'pass':'fail';detail.textContent=result.detail;
}
document.title=(rows.querySelectorAll('.fail').length?'FAIL':'PASS')+' · Wandel visibility check';
</script></body></html>
