<!doctype html><meta charset="utf-8"><title>Switcher lifecycle check</title><style>body{font:16px system-ui;margin:32px;background:#f7f6fb}button{font:inherit;padding:12px;margin:8px;background:white;border:1px solid #ddd;border-radius:12px}main{padding:24px;background:white;border-radius:18px}article{padding:24px;background:#efffe9;border-radius:16px}output{display:block;white-space:pre-wrap;margin:20px}ul{list-style:none;background:white;padding:20px;width:360px}.overlay{position:fixed;inset:160px 0 0;background:#0002;padding:30px;z-index:10}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}li button{display:flex;flex-direction:column;width:100%;align-items:start}small{color:#888}</style>
<div data-dx-ignore><button id="prepare">Add Test page</button><label><input id="back" type="checkbox"> Include an explicitly requested Back button</label><output id="status">Ready</output></div>
<main id="page"><h1 id="heading">General</h1><div id="open" role="button" tabindex="0" aria-controls="activities" aria-haspopup="listbox" aria-expanded="false"><span>Activity 2</span><span aria-hidden="true"> ▾</span></div><article><h2>Participant Reflection</h2><p>Existing page content stays on both screens.</p></article></main>
<script type="module">
import {Session} from '/extension/content/session.ts';import {Repository,BrowserStorage} from '/extension/storage/store.ts';import {ContextCollector} from '/extension/assistant/context.ts';import {compileAssistant} from '/extension/assistant/execute.ts';import {createWorkflow} from '/extension/prototype/engine.ts';
const root=document.querySelector('#page'),status=document.querySelector('#status'),session=new Session(root,new Repository(new BrowserStorage()),new URL(location.href),{assistantEnabled:true});const ready=session.init().then(()=>session.dispatch({type:'interact'}));
session.subscribe(s=>{status.textContent='Current page: '+s.workflow.states.find(p=>p.id===s.stateId).title+'\nIssues: '+JSON.stringify(s.unresolved);});
function close(){root.querySelector('.overlay')?.remove();document.querySelector('#open').setAttribute('aria-expanded','false');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
document.querySelector('#open').onclick=()=>{if(root.querySelector('.overlay')){close();return;}const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<ul role="listbox" id="activities" aria-label="Activities"><li><button role="option" aria-selected="true"><span>Activity 2</span><span class="sr">, selected,</span><small>October 21, 2026</small></button></li><li><button role="option" aria-selected="false"><span>Decimal Concepts Review</span><span class="sr">, unselected,</span><small>October 16, 2026</small></button></li></ul>';overlay.onclick=e=>{if(e.target===overlay)close();};root.append(overlay);document.querySelector('#open').setAttribute('aria-expanded','true');};
document.querySelector('#prepare').onclick=async()=>{await ready;try{const w=createWorkflow(new URL(location.href)),c=new ContextCollector(root,session.renderer.owned),option=c.ref(root.querySelector('[role=option][aria-selected=false]'));const defaults={relativeTo:null,element:null,description:null,labels:[],position:null,styleRef:null,style:null,destination:null,newViewTitle:null,resultRef:null,text:null};const actions=[{kind:'duplicate',targets:[option],text:'Test',position:'end',resultRef:'new:test'},{kind:'connect',targets:['new:test'],presentation:'page',newViewTitle:'Test'},{kind:'text',targets:[c.ref(root.querySelector('#heading'))],text:'Test'},...(document.querySelector('#back').checked?[{kind:'create',targets:[c.ref(root.querySelector('article'))],element:'button',text:'Back',position:'after',resultRef:'new:back'},{kind:'connect',targets:['new:back'],destination:w.entry}]:[])].map(a=>({...defaults,...a}));const result=compileAssistant(w,w.entry,{status:'edit',scope:'region',message:'Add Test page',reply:'Done',question:null,candidates:[],memory:null,actions},c);session.workflow=result.workflow;session.stateId=result.stateId;session.render(true);await session.dispatch({type:'interact'});result.verify();}catch(e){status.textContent=String(e);}};
</script>
